name: Test ZIP inbox processor

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/process-zip.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/process-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s .github/scripts/tests -v
