name: Manual AI workforce controller

on:
  workflow_dispatch:
    inputs:
      checkpoint_path:
        description: "Repository-relative path to a checkpoint JSON file"
        required: true
        default: "controller/state.example.json"
        type: string
  pull_request:
    paths:
      - "controller/**"
      - ".github/workflows/controller-manual.yml"

permissions:
  contents: read

concurrency:
  group: workforce-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run controller tests
        run: python -m unittest discover -s controller/tests -v
      - name: Validate and recommend next safe action
        env:
          CHECKPOINT_PATH: ${{ inputs.checkpoint_path || 'controller/state.example.json' }}
        run: python controller/next_action.py "$CHECKPOINT_PATH"
