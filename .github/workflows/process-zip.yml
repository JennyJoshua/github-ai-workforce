
name: Process ZIP inbox

# Extracts ZIP files uploaded to _inbox/ into the repository.
# Rules and limits live in .github/scripts/zip_inbox.py (archives cannot change it).
# Docs: docs/ZIP_INBOX_OPERATIONS.md

on:
  push:
    branches: [main] # change if your default branch has a different name
    paths:
      - "_inbox/*.zip"
  workflow_dispatch: # manual run: Actions tab > Process ZIP inbox > Run workflow

# Least privilege: contents: write is needed only to commit the extracted files.
permissions:
  contents: write

# One inbox job at a time; later runs wait instead of being cancelled.
concurrency:
  group: zip-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag shown in the comment).
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate and extract ZIP files
        id: zip
        run: python .github/scripts/zip_inbox.py --repo-root . --summary "$RUNNER_TEMP/zip-summary.md"

      - name: Publish run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/zip-summary.md" ]; then
            cat "$RUNNER_TEMP/zip-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push results
        if: steps.zip.outputs.processed != '0' || steps.zip.outputs.rejected != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(inbox): process ZIP uploads"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed to ${branch}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}). Rebasing on latest ${branch}..."
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              echo "::error::Rebase conflict with newer commits. Nothing was force-pushed. Re-run the workflow."
              exit 1
            fi
          done
          echo "::error::Could not push after 3 attempts. If '${branch}' is protected, direct pushes are blocked: see docs/ZIP_INBOX_OPERATIONS.md (Branch protection)."
          exit 1

      - name: Fail the run if any ZIP was rejected
        if: steps.zip.outputs.rejected != '0'
        run: |
          echo "::error::${{ steps.zip.outputs.rejected }} ZIP file(s) were rejected. The failure report is in _failed/ (also shown in the run summary)."
          exit 1
